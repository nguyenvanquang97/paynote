name: Android Release Build

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    name: Build and Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Build Android Release APK (with auto-versioning)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}

      - name: Rename APK file
        run: |
          # Find the generated Release APK and move it to a unique name
          find android/app/build/outputs/apk/release -name "*.apk" -exec mv {} app-v1.0.${{ github.run_number }}.apk \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          files: app-v1.0.${{ github.run_number }}.apk
          body: |
            Tự động build và phát hành từ GitHub Actions.
            Phiên bản: 1.0.${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
