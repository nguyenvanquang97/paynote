name: Android Release Build

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    name: Build and Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.11.0'
          cache: 'yarn'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Validate Build Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Missing required secret GEMINI_API_KEY"
            exit 1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing required secret SUPABASE_ANON_KEY"
            exit 1
          fi

      - name: Generate Runtime Env (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAYNOTE_AI_PROVIDER: gemini
          PAYNOTE_AI_LOCAL_ONLY: "false"
          PAYNOTE_API_URL: https://paynote-api.onrender.com
          SUPABASE_URL: https://icuixldcpchrkjyuvnqp.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node apps/mobile/scripts/with-env.js --generate-only
          test -f apps/mobile/src/config/runtimeEnv.local.ts
          grep -Eq 'SUPABASE_URL: "[^"]+"' apps/mobile/src/config/runtimeEnv.local.ts
          grep -Eq 'SUPABASE_ANON_KEY: "[^"]+"' apps/mobile/src/config/runtimeEnv.local.ts

      - name: Build Android Release APK (with auto-versioning)
        working-directory: apps/mobile/android
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAYNOTE_AI_PROVIDER: gemini
          PAYNOTE_AI_LOCAL_ONLY: "false"
          PAYNOTE_API_URL: https://paynote-api.onrender.com
          SUPABASE_URL: https://icuixldcpchrkjyuvnqp.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleRelease -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}

      - name: Rename APK file
        run: |
          # Find the generated Release APK and move it to a unique name
          find apps/mobile/android/app/build/outputs/apk/release -name "*.apk" -exec mv {} app-v1.0.${{ github.run_number }}.apk \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          files: app-v1.0.${{ github.run_number }}.apk
          body: |
            Tự động build và phát hành từ GitHub Actions.
            Phiên bản: 1.0.${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
